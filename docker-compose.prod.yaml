services:
  postgres:
    image: postgres:17.6-alpine
    restart: always
    volumes:
      - contest-system-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-contest_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-contestsystem}
      POSTGRES_DB: ${DATABASE_NAME:-contest_system_db}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DATABASE_USERNAME:-contest_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-contestsystem}
      - DATABASE_NAME=${DATABASE_NAME:-contest_system_db}
      - NODE_ENV=production
      - APP_PORT=3000

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  contest-system-db:
